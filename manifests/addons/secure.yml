  admin_password: (( vault meta.vault "/failsafe:admin_password" ))

instance_groups:
- name: shield
  jobs:
  - name: core
    properties:
      failsafe:
        username: (( grab params.admin_username ))
        password: (( vault meta.vault "/failsafe:admin_password" ))
