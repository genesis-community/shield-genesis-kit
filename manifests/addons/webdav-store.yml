---
# WebDAV backup store.
#
# Runs the release store job on the SHIELD VM next to the core.  The core
# already holds 80, 443, 8080, and 8200, so the store listens on 9080 and
# 9443 unless the environment says otherwise.  It reuses the kit server
# certificate, whose names include the SHIELD static IP, and a password that
# the kit generates in vault.
#
# The store job only starts on current nginx from SHIELD 9.4.2 onward, so the
# feature pins that release.  Spruce merges the entry over the pin in
# releases/shield.yml by name.

releases:
- name:    shield
  version: 9.4.2
  url:     https://github.com/shieldproject/shield-boshrelease/releases/download/v9.4.2/shield-boshrelease-9.4.2.tgz
  sha1:    f7b754bb4ec102ec000eb5c4046b9dcd06d17290

instance_groups:
- name: shield
  jobs:
  - (( append ))
  - name: store
    release: shield
    properties:
      port:     (( grab params.webdav_port     || 9080 ))
      ssl_port: (( grab params.webdav_ssl_port || 9443 ))
      tls:
        certificate: (( vault meta.vault "/certs/server:certificate" ))
        key:         (( vault meta.vault "/certs/server:key" ))
      webdav:
        auth:
          users:
          - username: (( grab params.webdav_username || "shield" ))
            password: (( vault meta.vault "/webdav:password" ))
