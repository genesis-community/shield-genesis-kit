---
# Ubuntu resolute stemcell.
#
# Loaded last by the resolute feature so that it wins over the ubuntu-noble
# default.  The stemcell version still comes from params.stemcell_version.
#
# Shield releases up to 9.4.0 call chpst, which resolute does not ship.  The
# 9.4.1 release replaces chpst with setpriv, and 9.4.2 also starts the store
# job on current nginx.  The feature pins 9.4.2 here, and spruce merges the
# entry over the pin in releases/shield.yml by name.  The kit does not deploy
# bpm, so there is no bpm pin here.

params:
  stemcell_os: ubuntu-resolute

releases:
- name:    shield
  version: 9.4.2
  url:     https://github.com/shieldproject/shield-boshrelease/releases/download/v9.4.2/shield-boshrelease-9.4.2.tgz
  sha1:    f7b754bb4ec102ec000eb5c4046b9dcd06d17290
