exodus:
  admin_password: shield
  admin_username: admin
  bosh: stackit-oauth
  ca_cert: <!{meta.vault}/certs/ca:certificate!>
  features: oauth
  iaas: null
  is_director: false
  pubkey: <!{meta.vault}/agent:public!>
  scale: null
  services: null
  url: https://10.99.0.16
  use_create_env: false
instance_groups:
- azs:
  - z1
  instances: 1
  jobs:
  - consumes:
      shield:
        from: shield
    name: shield-agent
    properties:
      core:
        ca: <!{meta.vault}/certs/ca:certificate!>
      env:
        http_proxy: ""
        https_proxy: ""
        no_proxy: ""
    release: shield
  - name: core
    properties:
      agent:
        key: <!{meta.vault}/agent:private!>
      core:
        authentication: test-auth
        env: S.H.I.E.L.D. OAuth on STACKIT
      domain: 10.99.0.16
      require-shield-core: true
      tls:
        certificate: <!{meta.vault}/certs/server:certificate!>
        key: <!{meta.vault}/certs/server:key!>
      vault:
        tls:
          ca: <!{meta.vault}/vault/ca:certificate!>
          certificate: <!{meta.vault}/vault/server:certificate!>
          key: <!{meta.vault}/vault/server:key!>
    provides:
      shield:
        as: shield
        shared: true
    release: shield
  name: shield
  networks:
  - name: shield
    static_ips:
    - 10.99.0.16
  persistent_disk_type: shield
  stemcell: bionic
  vm_type: small
name: stackit-oauth-shield
releases:
- name: shield
  sha1: 6671264cd7d3ca947639389630496e69d280c5aa
  url: https://github.com/shieldproject/shield-boshrelease/releases/download/v9.4.0/shield-boshrelease-9.4.0.tgz
  version: 9.4.0
stemcells:
- alias: bionic
  os: ubuntu-noble
  version: latest
update:
  canaries: 0
  canary_watch_time: 1000-300000
  max_in_flight: 1
  serial: true
  update_watch_time: 1000-300000
