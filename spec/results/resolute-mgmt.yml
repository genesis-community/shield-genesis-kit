exodus:
  admin_password: not-a-real-password
  admin_username: admin
  bosh: proto-main
  ca_cert: <!{meta.vault}/certs/ca:certificate!>
  features: ocfp,resolute
  iaas: aws
  agent_ip: 10.0.2.197
  api_url: https://shield.resolute.example.com
  dashboard_url: https://shield.resolute.example.com
  domain: shield.resolute.example.com
  is_director: false
  pubkey: <!{meta.vault}/agent:public!>
  scale: null
  services: null
  url: https://shield.resolute.example.com
  use_create_env: false
instance_groups:
- azs:
  - resolute-mgmt-z1
  instances: 1
  jobs:
  - consumes:
      shield:
        from: shield
    name: shield-agent
    properties:
      core:
        ca: <!{meta.vault}/certs/ca:certificate!>
      env:
        http_proxy: ""
        https_proxy: ""
        no_proxy: ""
    release: shield
  - name: core
    properties:
      agent:
        key: <!{meta.vault}/agent:private!>
      core:
        env: resolute-mgmt-shield
      domain: 10.0.2.197
      failsafe:
        password: not-a-real-password
        username: admin
      require-shield-core: true
      tls:
        certificate: <!{meta.vault}/certs/server:certificate!>
        key: <!{meta.vault}/certs/server:key!>
      vault:
        tls:
          ca: <!{meta.vault}/vault/ca:certificate!>
          certificate: <!{meta.vault}/vault/server:certificate!>
          key: <!{meta.vault}/vault/server:key!>
    provides:
      shield:
        as: shield
        shared: true
    release: shield
  name: shield
  networks:
  - name: resolute-mgmt.shield.net-shield
    static_ips:
    - 10.0.2.197
  persistent_disk_type: resolute-mgmt.shield.disk-shield
  stemcell: default
  vm_extensions:
  - shield-lb
  vm_type: resolute-mgmt.shield.vm-shield
name: resolute-mgmt-shield
releases:
- name: shield
  sha1: d49459b1773f598049806ff8c3dbd99eb6bec754
  url: https://github.com/shieldproject/shield-boshrelease/releases/download/v9.4.1/shield-boshrelease-9.4.1.tgz
  version: 9.4.1
stemcells:
- alias: default
  os: ubuntu-resolute
  version: "0.184"
update:
  canaries: 0
  canary_watch_time: 1000-300000
  max_in_flight: 1
  serial: true
  update_watch_time: 1000-300000
